name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: procureflow_owner
          # Throwaway password for an ephemeral CI container; not a secret.
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: procureflow_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U procureflow_owner -d procureflow_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://procureflow_owner:ci-only-password@127.0.0.1:5432/procureflow_dev
      TEST_DATABASE_URL: postgres://procureflow_owner:ci-only-password@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run db:migrate
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # Production dependencies must be free of known high/critical advisories.
      - run: npm audit --omit=dev --audit-level=high
      # Full tree (incl. dev tooling) is reported for triage; findings are tracked in phase reports.
      - run: npm audit --audit-level=high
        continue-on-error: true

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --verbose
